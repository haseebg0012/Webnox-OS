<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Set password · Webnox OS</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-page" data-auth="password">
    <main class="auth-layout">
      <aside class="auth-art"></aside>
      <section class="auth-side">
        <div class="auth-box">
          <div class="auth-brand"><span class="mark">W</span></div>
          <h1 id="auth-title">Welcome to your workspace</h1>
          <p class="auth-subtitle">
            Continue to confirm your invitation and choose a password.
          </p>
          <form class="auth-form" id="password-form">
            <div id="password-inputs" class="stack" hidden>
              <label class="field"
                ><span>New password</span
                ><input
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  minlength="8"
                /><small>Use at least 8 characters.</small></label
              ><label class="field"
                ><span>Confirm password</span
                ><input
                  type="password"
                  name="confirmation"
                  autocomplete="new-password"
                  minlength="8"
              /></label>
            </div>
            <p class="form-error" role="alert"></p>
            <button type="submit" class="btn primary">Continue</button>
          </form>
          <p class="auth-footer">Powered by Webnox OS</p>
        </div>
      </section>
    </main>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
